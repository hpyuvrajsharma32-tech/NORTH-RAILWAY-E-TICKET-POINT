<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Railway E-Ticket Point – Passenger Details Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #1f2937;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 15px;
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    table {
      margin-top: 30px;
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #2563eb;
      color: white;
    }
  </style>
</head>
<body>
  <h1>North Railway E-Ticket Point</h1>
  <form id="passengerForm">
    <label>Name:</label>
    <input type="text" id="name" required />

    <label>Age:</label>
    <input type="number" id="age" required />

    <label>Gender:</label>
    <select id="gender" required>
      <option value="">Select</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <label>From:</label>
    <input type="text" id="from" value="North Railway E-Ticket Point" readonly />

    <label>To:</label>
    <input type="text" id="to" required />

    <label>Class:</label>
    <select id="class" required>
      <option value="">Select</option>
      <option>1A</option>
      <option>2A</option>
      <option>3A</option>
      <option>SL</option>
      <option>2S</option>
    </select>

    <label>Quota:</label>
    <select id="quota" required>
      <option value="">Select</option>
      <option>General</option>
      <option>Tatkal</option>
      <option>Ladies</option>
      <option>Senior Citizen</option>
    </select>

    <label>Contact:</label>
    <input type="tel" id="contact" required />

    <button type="submit">Add Passenger</button>
  </form>

  <table id="passengerTable">
    <thead>
      <tr>
        <th>Name</th><th>Age</th><th>Gender</th><th>From</th><th>To</th><th>Class</th><th>Quota</th><th>Contact</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const form = document.getElementById('passengerForm');
    const tableBody = document.querySelector('#passengerTable tbody');
    const passengers = JSON.parse(localStorage.getItem('passengers')) || [];

    function renderTable() {
      tableBody.innerHTML = "";
      passengers.forEach(p => {
        const row = `<tr>
          <td>${p.name}</td><td>${p.age}</td><td>${p.gender}</td>
          <td>${p.from}</td><td>${p.to}</td><td>${p.classType}</td>
          <td>${p.quota}</td><td>${p.contact}</td>
        </tr>`;
        tableBody.innerHTML += row;
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const newPassenger = {
        name: name.value,
        age: age.value,
        gender: gender.value,
        from: from.value,
        to: to.value,
        classType: document.getElementById('class').value,
        quota: quota.value,
        contact: contact.value
      };
      passengers.push(newPassenger);
      localStorage.setItem('passengers', JSON.stringify(passengers));
      renderTable();
      form.reset();
      from.value = "North Railway E-Ticket Point";
    });

    renderTable();
  </script>
</body>
</html>
